<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Wake-on-LAN</title>
  <!-- relative on purpose: the page is always served as .../index.html, so
       these resolve next to it however the server is mounted -->
  <link rel="stylesheet" href="wake.css" />
</head>
<body>

  <header class="site-header">
    <div class="site-header-title">
      <svg xmlns="http://www.w3.org/2000/svg" height="20" width="20" viewBox="0 -960 960 960" aria-hidden="true"><path d="m320-80 40-280H160l360-520h80l-40 320h240L400-80h-80Z"/></svg>
      <span>Wake-on-LAN</span>
    </div>
    <button id="refresh-all" class="bar-btn" type="button">
      <svg xmlns="http://www.w3.org/2000/svg" height="14" width="14" viewBox="0 -960 960 960" aria-hidden="true"><path d="M480-160q-134 0-227-93t-93-227q0-134 93-227t227-93q69 0 132 28.5T720-690v-110h80v280H520v-80h168q-32-56-87.5-88T480-720q-100 0-170 70t-70 170q0 100 70 170t170 70q77 0 139-44t87-116h84q-28 106-114 173t-196 67Z"/></svg>
      <span>Refresh all</span>
    </button>
  </header>

  <main class="page flex flex-col gap-8">

    <section class="flex flex-col gap-3">
      <h2 class="section-title">Devices</h2>
      <div id="device-list" class="device-list flex flex-col gap-2">
        <div class="muted">Loading…</div>
      </div>
    </section>

    <section class="flex flex-col gap-3">
      <h2 class="section-title">Add device</h2>
      <form id="add-form" class="panel rounded-lg p-4" autocomplete="off">
        <div class="field-grid grid gap-3">
          <div class="field flex flex-col gap-1">
            <label for="f-name">Name</label>
            <input id="f-name" type="text" placeholder="My PC" />
          </div>
          <div class="field flex flex-col gap-1">
            <label for="f-ip">IP address <span class="optional">(optional)</span></label>
            <input id="f-ip" type="text" placeholder="192.168.1.10" />
          </div>
          <div class="field flex flex-col gap-1">
            <label for="f-mac">MAC address</label>
            <input id="f-mac" class="mono" type="text" placeholder="AA:BB:CC:DD:EE:FF" />
          </div>
        </div>
        <div class="field-grid grid gap-3">
          <div class="field flex flex-col gap-1">
            <label for="f-port">WoL port</label>
            <input id="f-port" type="number" value="9" min="1" max="65535" />
          </div>
          <div class="field flex flex-col gap-1">
            <label for="f-pingport">Ping port <span class="optional">(optional)</span></label>
            <input id="f-pingport" type="number" placeholder="e.g. 80, 22, 445" min="1" max="65535" />
          </div>
          <div class="field flex flex-col gap-1">
            <label for="f-password">SecureOn <span class="optional">(optional)</span></label>
            <input id="f-password" class="mono" type="text" placeholder="AABBCCDDEEFF" />
          </div>
        </div>
        <button type="submit" class="btn btn-primary rounded-md px-4 py-2 hover:opacity-90">Add device</button>
      </form>
    </section>

  </main>

  <div id="toasts" class="toast-stack flex flex-col gap-2"></div>

  <script src="wake.js"></script>
</body>
</html>
